name: Synthetic interface checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-tests:
    name: fixture-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: mrus-missing inspect-fixture tests/fixtures/interface-v1.json
