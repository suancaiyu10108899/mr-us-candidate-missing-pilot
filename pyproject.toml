[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-us-candidate-missing-pilot"
version = "0.3.0"
description = "Verified input preparation and module interfaces for a candidate-missing MR-US pilot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mrus-missing = "mrus_missing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
